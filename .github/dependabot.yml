version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Mondays and Thursdays at 10:00 Yerevan (GMT+4, no DST), every ecosystem.
    schedule:
      interval: cron
      cronjob: '0 10 * * 1,4'
      timezone: Asia/Yerevan
    open-pull-requests-limit: 5
    # Patch and minor updates arrive as one PR per group, so routine bumps do
    # not consume five slots and hide a security update behind them.
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    # Majors come one at a time: they need a human reading the changelog.
    ignore:
      # typescript-eslint 8.x declares `typescript: >=4.8.4 <6.1.0`. Taking 6.1
      # or 7 would leave every type-aware rule running against an unsupported
      # compiler -- no-floating-promises and no-misused-promises above all.
      # Move TypeScript together with typescript-eslint, deliberately.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # @types/node's major tracks the runtime it describes. Node 24 is pinned
      # in four places (Dockerfile, CI setup-node, .nvmrc, engines); a newer
      # major types APIs Node 24 does not have, so tsc passes while the call
      # crashes at runtime. It moves with the other four.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: deps
      prefix-development: deps-dev

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: cron
      cronjob: '0 10 * * 1,4'
      timezone: Asia/Yerevan
    ignore:
      # The Node version is four coordinated values -- see @types/node above.
      # Bumping only the image would ship a runtime nothing tests against, and
      # a major is how a non-LTS line arrives.
      - dependency-name: node
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: deps

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: cron
      cronjob: '0 10 * * 1,4'
      timezone: Asia/Yerevan
    ignore:
      # MySQL stays on the 8.4 LTS line the schema targets (gradfolio-sql;
      # hosted on Aiven). A 9.x innovation release locally would test against
      # a server the deployment does not run.
      - dependency-name: mysql
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 10 * * 1,4'
      timezone: Asia/Yerevan
    commit-message:
      prefix: ci
