name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast feedback: needs no services and fails in seconds.
  static:
    name: Format, lint, types, OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # The committed document must match what the schemas produce, or a
      # changed request shape ships a spec describing the old one.
      - run: npm run openapi:check

  test:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The thresholds are a floor; running them here stops it slipping.
      - run: npm run test:coverage

  # Behaviour that depends on MySQL is tested against MySQL 8.4, never a
  # stand-in: session time zone, real driver errors, utf8mb4.
  integration:
    name: Integration tests (MySQL 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gradfolio_test
          MYSQL_USER: gradfolio
          MYSQL_PASSWORD: gradfolio
          # Not UTC on purpose -- see docker-compose.yml.
          TZ: Asia/Yerevan
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: mysql://gradfolio:gradfolio@127.0.0.1:3306/gradfolio_test
      # Creates the throwaway databases the migration tests start from.
      TEST_ADMIN_DATABASE_URL: mysql://root:root@127.0.0.1:3306
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:int

  # MySQL commits DDL implicitly, so a migration cannot be rolled back as a
  # transaction; the runner records each step instead. This proves the real
  # migrations on an empty database: apply, re-apply is a no-op, roll back all
  # of them, re-apply, and the schema is identical both times.
  migrations:
    name: Migrations (MySQL 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gradfolio
          MYSQL_USER: gradfolio
          MYSQL_PASSWORD: gradfolio
          # Not UTC on purpose -- see docker-compose.yml.
          TZ: Asia/Yerevan
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: mysql://gradfolio:gradfolio@127.0.0.1:3306/gradfolio
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Apply every migration to an empty database
        run: |
          npm run -s migrate | tee applied.txt
          grep -q '^migrations: applied 0001_baseline' applied.txt

      - name: Applying again does nothing
        run: |
          out=$(npm run -s migrate)
          echo "$out"
          [ "$out" = "migrations: nothing to apply" ] || { echo "::error::second migrate was not a no-op"; exit 1; }

      - run: npm run -s db:schema > schema-first.sql

      - name: Roll every migration back
        run: |
          npm run -s migrate:down -- --all
          npm run -s db:schema > schema-empty.sql
          [ ! -s schema-empty.sql ] || { echo "::error::tables left after down --all"; cat schema-empty.sql; exit 1; }
          left=$(mysql -h127.0.0.1 -P3306 -ugradfolio -pgradfolio gradfolio -N -e "SELECT COUNT(*) FROM schema_migrations")
          [ "$left" = "0" ] || { echo "::error::$left registry rows left after down --all"; exit 1; }

      - name: Re-apply; the schema is identical to the first time
        run: |
          npm run -s migrate
          npm run -s db:schema > schema-second.sql
          diff schema-first.sql schema-second.sql

      # The row types in types.generated.ts must describe the migrated schema.
      - name: Generated row types match the migrated schema
        run: npm run -s db:types:check

      - name: The demo seed loads, and loads again to the same rows
        run: |
          npm run -s db:seed
          npm run -s db:seed

      # baseline.int.test.ts proves 0001_baseline equals this fixture; this
      # proves the fixture is still gradfolio-sql's schema.sql at the commit
      # the baseline was taken from.
      - name: The baseline fixture is gradfolio-sql schema.sql at 187ff66
        run: |
          curl -fsSL https://raw.githubusercontent.com/Levon0Asatryan/gradfolio-sql/187ff668cdcc3ab4139ace0359cc089d760e64dd/sql/schema.sql \
            | diff - src/testing/fixtures/gradfolio-sql-schema.sql

  # The deployment artefact has to build, and the stack has to come up.
  stack:
    name: Container stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack from one command
        run: docker compose up -d --build

      - name: Wait for the api to report ready
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000/readyz >/dev/null 2>&1; then
              echo "ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::api never became ready"
          docker compose ps -a; docker compose logs
          exit 1

      - name: Migrations ran before the api, and re-running them is a no-op
        run: |
          code=$(docker inspect gradfolio-api-migrate-1 --format '{{.State.ExitCode}}')
          [ "$code" = "0" ] || { echo "::error::migrate exited with $code"; docker compose logs migrate; exit 1; }
          docker compose logs migrate | grep -q 'migrations: applied 0004_project_source'
          tables=$(docker compose exec -T mysql mysql -ugradfolio -pgradfolio gradfolio -N -e \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'gradfolio' AND table_name <> 'schema_migrations'")
          [ "$tables" = "14" ] || { echo "::error::expected 14 tables, found $tables"; exit 1; }
          docker compose run --rm migrate | grep -qx 'migrations: nothing to apply'

      - name: Liveness, readiness, version prefix, JSON 404, docs
        run: |
          curl -fsS http://localhost:3000/healthz | grep -q '"status":"ok"'
          curl -fsS http://localhost:3000/readyz  | grep -q '"database":"ok"'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/v1/healthz)
          [ "$code" = "404" ] || { echo "::error::/v1/healthz answered $code"; exit 1; }
          curl -s http://localhost:3000/nope | grep -q '"code":"NOT_FOUND"'
          curl -fsS http://localhost:3000/docs-json | grep -q '"Gradfolio API"'

      # An unhandled pool error event is fatal in Node; a database restart must
      # not take the api down with it.
      - name: Survives a database restart
        run: |
          docker compose restart mysql
          sleep 5
          docker compose ps api --status running --format '{{.Name}}' | grep -q . \
            || { echo "::error::api died when the database restarted"; docker compose logs api; exit 1; }
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://localhost:3000/readyz \
            | grep -q '"database":"ok"'

      - name: Readiness fails while the database is down, liveness does not
        run: |
          docker compose stop mysql
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://localhost:3000/readyz)
          [ "$code" = "503" ] || { echo "::error::readyz answered $code with mysql down"; exit 1; }
          curl -fsS http://localhost:3000/healthz | grep -q '"status":"ok"'
          docker compose start mysql

      - name: Stops gracefully
        run: |
          docker compose stop api
          code=$(docker inspect gradfolio-api-api-1 --format '{{.State.ExitCode}}')
          [ "$code" = "0" ] || { echo "::error::api exited with $code, expected 0"; exit 1; }

      - name: Diagnostics on failure
        if: failure()
        run: docker compose ps -a && docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
